[mcp_servers.docs]
command = "example-mcp-server"
env_vars = ["DOCS_TOKEN", { name = "REMOTE_TOKEN", source = "remote" }]

[mcp_servers.docs.env]
INLINE_TOKEN = "PLANTED-SECRET-VALUE-09"

[mcp_servers.remote]
url = "https://example.invalid/mcp"
bearer_token_env_var = "MCP_BEARER_TOKEN"
auth = "oauth"

[mcp_servers.remote.oauth]
client_id = "example-client"
client_secret = "PLANTED-SECRET-VALUE-15"

[mcp_servers.remote.env_http_headers]
X-Api-Key = "REMOTE_API_KEY"

[mcp_servers.remote.http_headers]
Authorization = "PLANTED-SECRET-VALUE-10"

[mcp_servers.helper]
url = "https://example.invalid/helper-mcp"
auth = "chatgpt"
http_headers_helper = "example-header-helper --token PLANTED-SECRET-VALUE-16"
